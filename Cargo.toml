[package]
name = "awesomeify"
version = "0.1.0"
edition = "2021"
description = "Index and search open source repositories to create awesome lists on demand"
license = "MIT"
repository = "https://github.com/raskell-io/awesomeify"
keywords = ["awesome-list", "github", "indexer", "static-site"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "gzip"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# GraphQL
graphql_client = "0.14"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }

# Templating
tera = "1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Async trait
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Progress bars
indicatif = "0.17"

# Markdown parsing (for seed lists)
pulldown-cmark = "0.12"

# URL parsing
url = "2"

# Colored output
console = "0.15"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
tempfile = "3"

[[bin]]
name = "awesomeify"
path = "src/main.rs"
